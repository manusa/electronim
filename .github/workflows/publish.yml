name: Publish

on:
  push:
    tags:
    - '*'

jobs:
  linux:
    name: Linux Artifact
    runs-on: ubuntu-latest
    # Native modules (nodehun) link against the glibc and libstdc++ of the build system, build them on
    # the oldest supported Ubuntu LTS so that the AppImage and tar.gz load them there too
    container: ubuntu:22.04
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Build requirements
        run: |
          apt-get update
          apt-get install -y --no-install-recommends binutils ca-certificates g++ git make python3
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
      - name: Install
        run: npm install
      - name: Change Package version
        run: ./utils/version-from-tag.js
      - name: Build Linux
        # The snap is built and published by publish-snap.yml
        run: npm run build:linux -- AppImage tar.gz
      - name: Extract AppImage
        # Check what the AppImage ships, it adds the runtime libraries of the electron-builder toolset to
        # the application directory
        run: ./dist/electronim-linux-x86_64.AppImage --appimage-extract
      - name: Check glibc requirements
        run: ./utils/check-glibc.sh squashfs-root
      - name: Upload tar.gz
        run: ./utils/upload-artifact.js electronim-linux-x64.tar.gz application/tar+gzip
      - name: Upload AppImage
        run: ./utils/upload-artifact.js electronim-linux-x86_64.AppImage application/octet-stream
  macOS:
    name: macOS Artifact
    runs-on: macos-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
      - name: macOS requirements
        run: |
          brew install python-setuptools
      - name: Install
        run: npm install
      - name: Install macOS only requirement (Electron Builder)
        run: npm install dmg-license
      - name: Change Package version
        run: ./utils/version-from-tag.js
      - name: Build macOS
        run: npm run build:mac
      - name: Upload arm64-dmg
        run: ./utils/upload-artifact.js electronim-mac-arm64.dmg application/octet-stream
      - name: Upload arm64-tar.gz
        run: ./utils/upload-artifact.js electronim-mac-arm64.tar.gz application/tar+gzip
      - name: Upload x64-dmg
        run: ./utils/upload-artifact.js electronim-mac-x64.dmg application/octet-stream
      - name: Upload x64-tar.gz
        run: ./utils/upload-artifact.js electronim-mac-x64.tar.gz application/tar+gzip
