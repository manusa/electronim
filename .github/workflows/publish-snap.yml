name: Publish Snap

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish'
        required: true
        default: 'v0.0.0'
  push:
    tags:
    - '*'

jobs:
  snap:
    name: Snap Publish
    runs-on: ubuntu-latest
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_LOGIN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Empty on tag pushes, which checks out the pushed tag
          ref: ${{ inputs.version }}
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
      - name: Install
        run: npm install
      - name: Version from dispatch inputs
        if: github.event_name == 'workflow_dispatch'
        run: echo "WORKFLOW_DISPATCH_GITHUB_REF=refs/tags/${{ inputs.version }}" >> $GITHUB_ENV
      - name: Change Package version
        run: ./utils/version-from-tag.js
      - name: Build Snap
        run: npm run build:linux -- snap
      - name: Publish
        run: |
          sudo apt update && sudo apt-get install snapd
          sudo chown root:root / # Snapcraft requires '/' to be root owned
          sudo snap install snapcraft --classic
          snapcraft upload --release=stable ./dist/electronim-linux-amd64.snap
